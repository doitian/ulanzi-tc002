<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>tc002</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/style.css?v=4">
</head>
<body>
  <main>
    <h1>tc002</h1>
    <section id="auth" hidden>
      <label>Token <input id="token" type="password" autocomplete="off"></label>
      <button id="save-token" type="button">Save</button>
      <p id="auth-error" class="error"></p>
    </section>
    <section>
      <h2>Apps</h2>
      <form id="create-form">
        <label>Name <input id="create-name" name="name" required maxlength="32" pattern="[A-Za-z0-9][A-Za-z0-9_-]{0,31}" title="1-32 letters, digits, _ or -"></label>
        <label>Type
          <select id="create-type" name="type">
            <option value="text">text</option>
            <option value="image">image</option>
          </select>
        </label>
        <button type="submit">Create</button>
      </form>
      <p id="error" class="error"></p>
      <div id="apps"></div>
    </section>
  </main>
  <script src="/app.js?v=4"></script>
</body>
</html>
