[project]
name = "ulanzi-tc002"
version = "0.1.0"
description = "HTTP widgets for the Ulanzi TC002 pixel display"
readme = "README.md"
requires-python = ">=3.13"
dependencies = []

[project.optional-dependencies]
server = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "mcp>=2",
    "pillow>=11",
]

[project.scripts]
tc002 = "ulanzi_tc002.client.cli:cli"
tc002-server = "ulanzi_tc002.server.main:cli"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ulanzi_tc002.server" = ["ui/*"]
"ulanzi_tc002.plugins" = ["*.js"]
